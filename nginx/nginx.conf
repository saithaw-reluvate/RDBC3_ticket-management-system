# Production reverse proxy — docs/DEPLOYMENT.md §2/§3 Decisions 2-4.
#
# One proxied upstream: the frontend container. The Next.js /api/* rewrite
# already forwards API calls to the backend server-side (BACKEND_ORIGIN) —
# that mechanism is unchanged from dev, so nginx does not need its own
# /api/ routing rule. The one exception is /static/, served directly from
# the shared staticfiles volume for Django's /admin/ site and DRF's
# browsable API. /media/ is deliberately NOT configured here — attachments
# are served only through the access-checked Django view (CLAUDE.md).

server {
    listen 80;
    server_name _;

    # 5 attachments x 5MB each (docs/BACKEND.md §2 Decision 3) plus
    # multipart/form-data overhead; Django/DRF still enforce the real caps.
    client_max_body_size 30m;

    location /static/ {
        alias /staticfiles/;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
